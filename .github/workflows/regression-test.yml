name: Regression-Test nach Deploy

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installieren
        run: npm install playwright && npx playwright install --with-deps chromium

      - name: Warten bis Render-Deploy live ist (Render deployt automatisch bei Push)
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s https://am-matt-loyalty-staging.onrender.com/api/health | grep -o '"ok":true' || echo "")
            if [ -n "$STATUS" ]; then echo "Server erreichbar."; break; fi
            echo "Warte auf Deploy... ($i/30)"; sleep 10
          done

      - name: Beweisen, dass GENAU dieser Commit live deployed ist (nicht nur Server erreichbar)
        run: |
          for i in $(seq 1 30); do
            LIVE_COMMIT=$(curl -s https://am-matt-loyalty-staging.onrender.com/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo "")
            echo "Live-Commit laut /api/health: $LIVE_COMMIT (erwartet Praefix von: $GITHUB_SHA)"
            case "$GITHUB_SHA" in "$LIVE_COMMIT"*) echo "Bestaetigt: exakter Commit ist live."; break ;; esac
            if [ "$i" = "30" ]; then
              echo "::warning::Render Auto-Deploy hat diesen Commit nach 5 Minuten NICHT deployed."
              echo "::warning::Bekannte Betriebslücke: GitHub-Repo hat KEINE klassischen Webhooks (bestaetigt via 'gh api repos/.../hooks' -> []) - Render nutzt vermutlich die GitHub-App-Integration, die gelegentlich haengt."
              echo "::warning::Workaround (manuell, bis Owner die Render<->GitHub-App-Verbindung im Dashboard neu autorisiert): render deploys create srv-daar7p7avr4c73b9hjng --confirm"
              exit 1
            fi
            sleep 10
          done

      - name: Zusaetzliche Pufferzeit fuer vollstaendigen Deploy-Rollout (Static Assets + API)
        run: sleep 45

      - name: Regressionssuite ausfuehren (gegen isolierten QA-Tenant, NIE Produktivdaten)
        env:
          STAGING_URL: https://am-matt-loyalty-staging.onrender.com
        run: |
          set -e
          node tests/cross-device-qa.js
          node tests/staff-admin-e2e.js
          node tests/pilot-final-verification.js
