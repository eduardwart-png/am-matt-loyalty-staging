name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'native/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install

      - name: Sync Capacitor (copies config, no web build needed - app loads live URL)
        working-directory: native
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: native/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: am-matt-stammgast-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
